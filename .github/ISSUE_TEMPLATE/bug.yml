name: Bug report
description: Report a reproducible problem with casting, saves, visibility, or reveal.
title: "[Bug]: "
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Foundry VTT, PF2e system, and Hidden Enemy Spells versions.
      placeholder: Foundry14.369 / PF2e8.6.0 / module0.1.0
    validations:
      required: true
  - type: input
    id: spell
    attributes:
      label: Spell and variant
      description: Include legacy/remastered status and heightened rank if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include GM/player perspective, NPC ownership/alliance, and relevant visibility settings.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: other_modules
    attributes:
      label: Other modules and minimal-world result
      description: Can you reproduce with only Hidden Enemy Spells enabled? Attach only sanitized logs/screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private player information, and campaign exports from this report.
          required: true
